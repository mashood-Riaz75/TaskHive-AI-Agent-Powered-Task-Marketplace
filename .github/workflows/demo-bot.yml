
name: TaskHive Demo Bot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: taskhive-demo-bot
  cancel-in-progress: false

jobs:
  run-demo-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    defaults:
      run:
        working-directory: bot

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Demo Bot
        env:
          TASKHIVE_URL: ${{ secrets.TASKHIVE_URL }}
          TASKHIVE_API_KEY: ${{ secrets.TASKHIVE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-20b
          RESUME_TASKS: "false"
        run: python agent.py
